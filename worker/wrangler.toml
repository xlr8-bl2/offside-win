name = "offside-win"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# The page and its assets. Served directly; the Worker only runs for /api/*.
[assets]
directory = "../public"
binding = "ASSETS"

# Where the read path points. Both values are substituted by .github/workflows/
# deploy.yml from repository secrets, the same way the D1 database id was before
# it, so nothing credential-shaped is committed to a public repo.
#
# These are vars rather than secrets on purpose. The anon key is not a secret:
# it is Supabase's public client key, meant to ship in a browser, and what
# confines it to reading is row-level security and SELECT-only grants in
# schema.pg.sql — not obscurity. Keeping it a var means a deploy is one step and
# cannot leave a freshly created Worker briefly unable to reach the database.
[vars]
SUPABASE_URL = "REPLACE_WITH_SUPABASE_URL"
SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"
