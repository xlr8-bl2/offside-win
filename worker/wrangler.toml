name = "offside-win"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# The page and its assets. Served directly; the Worker only runs for /api/*.
[assets]
directory = "../public"
binding = "ASSETS"

# The only binding the Worker needs. No secrets, no API keys: every number the
# Worker serves was computed in GitHub Actions and written here already.
# Create with:  wrangler d1 create offside-win
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "offside-win"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
