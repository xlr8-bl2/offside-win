name = "offside-win"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# The page and its assets. Served directly; the Worker only runs for /api/*.
# dist/ is public/ as deployed: minified and versioned by
# scripts/build-public.mjs, which deploy.yml runs first.
[assets]
directory = "../dist"
# The front page is written by the Worker (seo.ts, homePage) so a search
# engine reads today's matches rather than an empty shell; if that fails the
# Worker hands back index.html from here as before.
run_worker_first = ["/"]
binding = "ASSETS"

# Where the read path points. Both values are substituted by .github/workflows/
# deploy.yml from repository secrets, the same way the D1 database id was before
# it, so nothing credential-shaped is committed to a public repo.
#
# These are vars rather than secrets on purpose. The anon key is not a secret:
# it is Supabase's public client key, meant to ship in a browser, and what
# confines it to reading is row-level security and SELECT-only grants in
# schema.pg.sql — not obscurity. Keeping it a var means a deploy is one step and
# cannot leave a freshly created Worker briefly unable to reach the database.
[vars]
SUPABASE_URL = "REPLACE_WITH_SUPABASE_URL"
SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"

# Where the money goes and which environment takes it. None of these are
# secrets -- a wallet address is public by nature and the base URL is in the
# docs -- so they live here where they can be read and changed in a diff.
#
# Staging until KYB is done. Point COINFLOW_BASE_URL at api.coinflow.cash and
# the same code takes real cards.
COINFLOW_BASE_URL = "https://api-sandbox.coinflow.cash"
COINFLOW_WALLET = ""
COINFLOW_BLOCKCHAIN = "solana"
SITE_URL = "https://offside.win"
# Google sign-in's OAuth client ID. Public by design: Google puts it in every
# sign-in link, and the "Sign in with Google" button needs it in the page. The
# client secret is not here and never will be; it lives in Supabase only.
GOOGLE_CLIENT_ID = "819619713096-r9gvdihj81gjinubr5nqqgd721vcfqud.apps.googleusercontent.com"
# "1": https://offside.win/ is an authorised redirect URI on that client (it is).
# Then the Google button is a plain link to Google's page, and back: no
# popup, no frame drawn by Google's script. Until then it stays "0" and the
# page uses Google's own button, because the redirect would land on Google's
# "redirect_uri_mismatch" error.
GOOGLE_REDIRECT = "1"

# Which processor takes the money. "whop": Whop's card form sits on our
# pricing page, the billing runs at Whop, and Whop tells us by webhook.
# "coinflow": the card-and-USDC path above. Whop's two secrets,
# WHOP_API_KEY and WHOP_WEBHOOK_SECRET, are pushed by deploy.yml.
PAY_PROVIDER = "whop"
# The Whop business the plans are made under (Whop dashboard, Settings). An
# id, not a secret. Empty until set: the checkout falls back to each plan's
# own Whop link, and with none of those, says memberships are not open yet.
WHOP_COMPANY_ID = "biz_u3qYuQLDjOpDZH"
# The owner's dashboard (#/admin, worker/src/admin.ts): the SHA-256 of the
# lower-cased email that may open it, comma-separated for more than one.
# Only the hash is here; the address is not.
ADMIN_EMAIL_SHA256 = "5a2087bbcb792ea743dd4e445fcef43ccb4818f37f5199981e3ec93d9ea26916"

# Every ten minutes the Worker asks Whop for paid memberships and switches on
# any the webhook missed (sweepWhop in src/pay.ts). The webhook is fast; this
# is what makes a payment certain to count even when a delivery never comes.
[triggers]
# And once a day at 06:20 UTC, a day added to every paying member for each
# quiet day of an international break or close season (src/goodwill.ts).
crons = ["*/10 * * * *", "20 6 * * *"]

# The site's database since October 2026 (HANDOFF.md, "The move to D1"). The
# public reads (src/d1read.ts) and the engine's door (src/enginedb.ts) use it.
# The id is filled in by deploy.yml, which finds the database by name.
[[d1_databases]]
binding = "DB"
database_name = "offside"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Outbound email through Cloudflare Email Service (src/mail.ts). On since the
# account moved to Workers Paid. Sending also needs offside.win onboarded under
# Compute, Email Service, Email Sending; until it is, Cloudflare refuses each
# message (E_SENDER_NOT_VERIFIED in the logs) and mail.ts sends it through
# Brevo instead, so nothing is lost either way.
[[send_email]]
name = "EMAIL"
