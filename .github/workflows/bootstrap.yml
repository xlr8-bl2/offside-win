name: bootstrap

# One-click first run. The order is load-bearing:
#
#   migrate  → create the tables
#   history  → backfill finished matches and their stats (the slow step)
#   ratings  → fit Dixon-Coles and the corner/card models per league
#   slate    → price the next 72 hours and publish the board
#
# Running slate before ratings publishes nothing, deliberately: a league with no
# fitted ratings is skipped rather than falling back to the bookmaker's price
# dressed up as an opinion of our own.
#
# After this, the scheduled workflows keep themselves going.
#
# REGISTRATION: this repo was created with GitHub's importer, which copies workflow
# files into git without registering them with Actions. A workflow stays invisible to
# the API — not listable, not dispatchable, 404 on dispatch — until a push modifies
# its file on the default branch. That is what this block is doing here. See HANDOFF.md.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons of history to backfill (more is slower but fits better)'
        type: string
        default: '3'
      leagues:
        # Defaulted, not blank. Blank means every league the provider covers —
        # 88 of them across three seasons — which exhausted D1's free-tier daily
        # row-write quota 27 minutes into the first real run. Blank is still
        # accepted and still means everything; it just is not the default you
        # get by pressing the button.
        description: 'Comma-separated league IDs. Blank means EVERY league the provider covers, which will exhaust D1 free-tier daily writes.'
        type: string
        default: '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90'
      skip_history:
        description: 'Skip the backfill (use when re-fitting existing history)'
        type: boolean
        default: false

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      DB_BACKEND: postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      HISTORY_SEASONS: ${{ inputs.seasons }}
      LEAGUES: ${{ inputs.leagues }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Create tables
        run: npm run migrate

      - name: Backfill match history
        if: ${{ !inputs.skip_history }}
        run: npm run history

      - name: Fit ratings
        run: npm run ratings

      - name: Price the slate
        run: npm run slate

      - name: Summary
        run: |
          echo "Bootstrap complete. The scheduled workflows now keep this going:"
          echo "  slate   every 30 min  — reprices and republishes the board"
          echo "  settle  hourly        — grades finished picks, refreshes calibration"
          echo "  ratings daily 04:00   — backfills new results and refits"
          echo ""
          echo "Run the 'backtest' workflow to find out whether the model is any good."
