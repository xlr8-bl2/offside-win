name: slate

# Reprices the next 72 hours and republishes the board. Frequent because the
# edge appears when team news lands: a confirmed lineup an hour before kickoff
# is the moment provisional picks become real ones.
#
# On the very first run there are no fitted ratings, so this backfills a season
# and fits them before pricing anything — otherwise it would publish nothing,
# every half hour, until somebody noticed. That first run takes far longer than
# the rest, hence the timeout.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # The first run cold-starts by backfilling, so it needs the same
          # tracked set as ratings — otherwise it would discover all 88 leagues
          # and exhaust D1's daily row-write quota.
          LEAGUES: ${{ vars.LEAGUES || '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90' }}
        run: npm run slate
