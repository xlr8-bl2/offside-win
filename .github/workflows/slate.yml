name: slate

# Reprices the next 72 hours and republishes the board. Frequent because the
# edge appears when team news lands: a confirmed lineup an hour before kickoff
# is the moment provisional picks become real ones.
#
# On the very first run there are no fitted ratings, so this backfills a season
# and fits them before pricing anything — otherwise it would publish nothing,
# every half hour, until somebody noticed. That first run takes far longer than
# the rest, hence the timeout.
on:
  schedule:
    # Every fifteen minutes. Team news is the whole edge: a confirmed eleven an
    # hour before kick-off is the moment a provisional pick becomes a real one,
    # and a thirty-minute cadence meant half of that window could pass before
    # the board caught up. The run is idempotent and the provider is not the
    # bottleneck, so the extra passes cost little and close the gap.
    #
    # GitHub starts a schedule this frequent only when it has capacity, which
    # was every three to six hours. So the job itself loops (slate:loop): a
    # pass every fifteen minutes for five and a half hours, and this schedule
    # only has to start the next job when one ends. A trigger that arrives
    # while a job is running waits as the next one.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Its own lock, because a job now lasts hours: settle and ratings must not
# queue behind it. They write different rows (settled picks, ratings) from
# the ones the slate writes, and Postgres keeps each write whole.
concurrency:
  group: slate
  cancel-in-progress: false

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # The provider's answers from the last job (engine/src/bsd.ts, ttlFor):
      # on the free plan's 7,500 requests a day, a squad or a table is asked
      # for once a day, not once a pass.
      - uses: actions/cache/restore@v4
        with:
          path: bsd-cache.json
          key: bsd-cache-${{ github.run_id }}
          restore-keys: bsd-cache-
      - env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_CACHE_FILE: ${{ github.workspace }}/bsd-cache.json
          # Of the day's 7,500, what this job leaves for the ratings, the
          # results and the Worker's live scores.
          BSD_RESERVE: '1800'
          # The next day and a half, not three: on the free plan the third day
          # cost as much as the first two and nobody reads it yet.
          SLATE_HORIZON_HOURS: '36'
          # D1 through the Worker's engine door (HANDOFF.md, "The move to D1").
          DB_BACKEND: d1
          ENGINE_DB_URL: https://offside.win/api/internal/db
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Must match the tracked set ratings fits, or the slate prices
          # fixtures in leagues that have no ratings. Empty means all of them.
          LEAGUES: ${{ vars.LEAGUES }}
          # Every thirty minutes on D1: each query is a request to the Worker,
          # and fifteen-minute passes alone would use the plan's monthly
          # allowance of ten million requests.
          SLATE_LOOP_EVERY: '60'
          # Optional. Without it the template grammar writes the narratives, in
          # the old voice, and the run says so -- which is the fallback working
          # rather than a failure. Google has cut this free tier sharply and
          # without notice before, so that path has to stay live.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variables; empty means the defaults in slate.ts
          # (200 requests a day in all, 20 per model, 8 a minute, the list of
          # Flash models in slate.ts).
          GEMINI_PER_DAY: ${{ vars.GEMINI_PER_DAY }}
          GEMINI_PER_MODEL: ${{ vars.GEMINI_PER_MODEL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run slate:loop
      - uses: actions/cache/save@v4
        if: always() && hashFiles('bsd-cache.json') != ''
        with:
          path: bsd-cache.json
          key: bsd-cache-${{ github.run_id }}
