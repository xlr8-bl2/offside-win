name: deploy

# The repo was empty when this branch was first pushed, so GitHub promoted that
# branch to default rather than creating `main`. Both are listed so deploy fires
# on whichever is current, and renaming the default later needs no edit here.
#
# The daily schedule is what makes this self-starting. A repository created by
# import receives no push, so a push-only trigger would leave the site
# unpublished indefinitely while the data quietly loaded behind it. Deploying is
# idempotent — same schema, same Worker — so running it daily costs a minute and
# removes a manual step that can be forgotten.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['worker/**', 'public/**', 'schema.pg.sql', 'engine/src/sql-split.ts', '.github/workflows/deploy.yml']
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # The schema is applied before the Worker is deployed, never after: the
      # new Worker reads through serving functions that a stale schema does not
      # have, and deploying first would serve 502s for as long as the migration
      # took.
      - name: Apply the Postgres schema (idempotent)
        env:
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate

      # Substituted rather than committed: the repo is public. See the comment
      # in worker/wrangler.toml for why the anon key is a var and not a secret.
      # Passed through the environment rather than interpolated into the script,
      # so nothing secret-shaped is ever a shell token.
      - name: Point the Worker at Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY must both be set as repository secrets."
            echo "Supabase dashboard -> Project Settings -> API: 'Project URL' and the 'anon public' key."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "worker/wrangler.toml";
            const url = process.env.SUPABASE_URL.replace(/\/+$/, "");
            let s = fs.readFileSync(path, "utf8");
            s = s.replace("REPLACE_WITH_SUPABASE_URL", () => url)
                 .replace("REPLACE_WITH_SUPABASE_ANON_KEY", () => process.env.SUPABASE_ANON_KEY);
            if (s.includes("REPLACE_WITH")) throw new Error("a placeholder was left unsubstituted");
            fs.writeFileSync(path, s);
            console.log("wrangler.toml points at " + url);
          '

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A deploy that typechecks and a deploy that serves are different claims.
      # This makes the difference visible in the run rather than in a reader's
      # browser: /api/health round-trips the Worker, PostgREST, the anon key,
      # RLS and the serving functions in one request, and /api/board proves the
      # part that actually carries the product.
      - name: Verify the live read path
        env:
          SITE: ${{ vars.SITE_URL || 'https://offside-win.ashleymbaht.workers.dev' }}
        run: |
          set -uo pipefail
          body=""
          for i in 1 2 3 4 5; do
            sleep $((i * 4))
            if body=$(curl -fsS "$SITE/api/health"); then break; fi
            echo "attempt $i failed, retrying"
          done
          echo "health: $body"
          case "$body" in
            *'"ok":true'*) ;;
            *) echo "health check did not report ok"; exit 1 ;;
          esac
          case "$body" in
            *'"stale":false'*) ;;
            *) echo "WARNING: the board is stale - check that the slate workflow is running" ;;
          esac
          count=$(curl -fsS "$SITE/api/board?hours=72" | head -c 200)
          echo "board: $count"
          case "$count" in
            *'"fixtures"'*) ;;
            *) echo "the board did not come back in the expected shape"; exit 1 ;;
          esac
