name: deploy

# The repo was empty when this branch was first pushed, so GitHub promoted that
# branch to default rather than creating `main`. Both are listed so deploy fires
# on whichever is current, and renaming the default later needs no edit here.
#
# The daily schedule is what makes this self-starting. A repository created by
# import receives no push, so a push-only trigger would leave the site
# unpublished indefinitely while the data quietly loaded behind it. Deploying is
# idempotent — same schema, same Worker — so running it daily costs a minute and
# removes a manual step that can be forgotten.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['worker/**', 'public/**', 'schema.pg.sql', 'engine/src/sql-split.ts', '.github/workflows/deploy.yml']
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # The schema is applied before the Worker is deployed, never after: the
      # new Worker reads through serving functions that a stale schema does not
      # have, and deploying first would serve 502s for as long as the migration
      # took.
      - name: Apply the Postgres schema (idempotent)
        env:
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate

      # Substituted rather than committed: the repo is public. See the comment
      # in worker/wrangler.toml for why the anon key is a var and not a secret.
      # Passed through the environment rather than interpolated into the script,
      # so nothing secret-shaped is ever a shell token.
      - name: Point the Worker at Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY must both be set as repository secrets."
            echo "Supabase dashboard -> Project Settings -> API: 'Project URL' and the 'anon public' key."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "worker/wrangler.toml";
            const url = process.env.SUPABASE_URL.replace(/\/+$/, "");
            let s = fs.readFileSync(path, "utf8");
            s = s.replace("REPLACE_WITH_SUPABASE_URL", () => url)
                 .replace("REPLACE_WITH_SUPABASE_ANON_KEY", () => process.env.SUPABASE_ANON_KEY);
            if (s.includes("REPLACE_WITH")) throw new Error("a placeholder was left unsubstituted");
            fs.writeFileSync(path, s);
            console.log("wrangler.toml points at " + url);
          '

      # Unlike SUPABASE_ANON_KEY these are real secrets, so they are pushed as
      # wrangler secrets rather than substituted into a committed file. The
      # repo is public; nothing here may end up in git or in a log.
      #
      # Each is optional on purpose. Payments are unconfigured until an account
      # exists, and a missing key must leave the read path deploying normally
      # rather than failing the whole workflow -- the site is not a shop yet.
      - name: Push the payment secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COINFLOW_API_KEY: ${{ secrets.COINFLOW_API_KEY }}
          COINFLOW_WEBHOOK_SECRET: ${{ secrets.COINFLOW_WEBHOOK_SECRET }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          for name in SUPABASE_SERVICE_KEY COINFLOW_API_KEY COINFLOW_WEBHOOK_SECRET WHOP_WEBHOOK_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is not set - skipping (payments stay switched off)"
              continue
            fi
            # Piped rather than passed as an argument, so it never becomes a
            # process-table entry or a shell history line.
            printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null \
              && echo "$name pushed" || echo "WARNING: could not push $name"
          done

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A deploy that typechecks and a deploy that serves are different claims.
      # This makes the difference visible in the run rather than in a reader's
      # browser: /api/health round-trips the Worker, PostgREST, the anon key,
      # RLS and the serving functions in one request, and /api/board proves the
      # part that actually carries the product.
      - name: Verify the live read path
        env:
          SITE: ${{ vars.SITE_URL || 'https://offside.win' }}
        run: |
          set -uo pipefail
          body=""
          for i in 1 2 3 4 5; do
            sleep $((i * 4))
            if body=$(curl -fsS "$SITE/api/health"); then break; fi
            echo "attempt $i failed, retrying"
          done
          echo "health: $body"
          # Postgres' json_build_object writes `"ok" : true`, with spaces around
          # the colon, so matching the compact spelling failed a check on a
          # response that was perfectly healthy. Compare with the whitespace
          # squeezed out rather than assuming either spelling.
          flat=$(printf '%s' "$body" | tr -d ' \n')
          case "$flat" in
            *'"ok":true'*) ;;
            *) echo "health check did not report ok"; exit 1 ;;
          esac
          case "$flat" in
            *'"stale":false'*) ;;
            *) echo "WARNING: the board is stale - check that the slate workflow is running" ;;
          esac
          # Not piped into head: head closes the pipe at 200 bytes, curl -f dies
          # writing to it, and the step fails with exit 23 on a board that came
          # back perfectly. Fetch it whole — it is 64KB — then trim.
          curl -fsS "$SITE/api/board?hours=72" -o /tmp/board.json
          board=$(tr -d ' \n' < /tmp/board.json | cut -c1-200)
          echo "board: $board"
          case "$board" in
            *'"fixtures":['*) ;;
            *) echo "the board did not come back in the expected shape"; exit 1 ;;
          esac
          case "$board" in
            *'"count":0,'*) echo "the board is EMPTY - the slate has published nothing"; exit 1 ;;
          esac
