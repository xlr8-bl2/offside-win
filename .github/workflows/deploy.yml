name: deploy

# The repo was empty when this branch was first pushed, so GitHub promoted that
# branch to default rather than creating `main`. Both are listed so deploy fires
# on whichever is current, and renaming the default later needs no edit here.
#
# The daily schedule is what makes this self-starting. A repository created by
# import receives no push, so a push-only trigger would leave the site
# unpublished indefinitely while the data quietly loaded behind it. Deploying is
# idempotent — same schema, same Worker — so running it daily costs a minute and
# removes a manual step that can be forgotten.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['worker/**', 'public/**', 'schema.sql', '.github/workflows/deploy.yml']
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Point wrangler at the D1 database
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ secrets.CF_D1_DATABASE_ID }}/" worker/wrangler.toml
      - name: Apply schema (idempotent)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 execute offside-win --remote --file=../schema.sql --yes
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
