name: probe

# Walks a real fixture end to end and reports what the provider actually
# returns. This exists because the provider's OpenAPI types several of the
# fields the model leans on hardest — weather, head_to_head,
# unavailable_players, appointment_effect, prediction markets — as `any`.
# Everything parses defensively against alias lists, but this is what replaces
# the guesses with facts.
#
# Needs only BSD_API_KEY, so it can be run before any Cloudflare setup exists.
#
# NOTE ON VISIBILITY: this repo is public, so these logs and artifacts are
# readable by anyone. The job prints *shape sketches* — field names and types —
# rather than payload values, for that reason. Your API key is never printed and
# GitHub masks it regardless.
#
# REGISTRATION: this repo was created with GitHub's importer, which copies workflow
# files into git without registering them with Actions. A workflow stays invisible to
# the API — not listable, not dispatchable, 404 on dispatch — until a push modifies
# its file on the default branch. That is what this block is doing here. See HANDOFF.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          full (walk a fixture and sketch every feed) or report (one finished
          match: every incident type, the post-match line-ups, the per-player
          stats)
        type: choice
        options: [full, report]
        default: full

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Probe the provider
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: npm run ${{ inputs.mode == 'report' && 'probe:report' || 'probe' }}

      # The probe runs as `npm -w engine run probe`, so npm sets the working
      # directory to the workspace root — engine/ — and `probe-output/` is
      # written there, not at the repo root. Reading it from the repo root finds
      # nothing and, because the loop skips silently and upload-artifact only
      # warns, the job still goes green while reporting absolutely nothing.
      # The report mode prints straight to the log and writes no sketches.
      - name: Print inferred shapes
        if: inputs.mode != 'report'
        run: |
          echo "Field names and types only — no payload values."
          shopt -s nullglob
          found=0
          for f in engine/probe-output/*.sketch.json; do
            found=1
            echo ""
            echo "=============================================================="
            echo "=== $(basename "$f" .sketch.json)"
            echo "=============================================================="
            head -c 6000 "$f"
            echo ""
          done
          if [ "$found" -eq 0 ]; then
            echo "No sketches were written. The probe step did not produce output."
            ls -la engine/probe-output/ 2>&1 || true
            exit 1
          fi

      - name: Endpoint availability
        if: inputs.mode != 'report'
        run: |
          echo "Which endpoints this tier actually serves:"
          cat engine/probe-output/_summary.json | head -c 4000

      # Sketches and the summary only. The raw payloads stay on the runner:
      # this repo is public, so artifacts are world-readable, and the whole
      # point of sketching is to publish field shapes without payload values.
      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'report'
        with:
          name: probe-output
          path: |
            engine/probe-output/*.sketch.json
            engine/probe-output/_*.json
          retention-days: 3
          if-no-files-found: warn
