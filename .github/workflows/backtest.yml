name: backtest

# Walk-forward evaluation. Manual, because it is the job that decides whether
# the model ships, not a thing to run on a timer.
#
# REGISTRATION: this repo was created with GitHub's importer, which copies workflow
# files into git without registering them with Actions. A workflow stays invisible to
# the API — not listable, not dispatchable, 404 on dispatch — until a push modifies
# its file on the default branch. That is what this block is doing here. See HANDOFF.md.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Label for this backtest run'
        type: string
        default: 'manual'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKTEST_LABEL: ${{ inputs.label }}
        run: npm run backtest
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: engine/backtest-report.json
          if-no-files-found: warn
