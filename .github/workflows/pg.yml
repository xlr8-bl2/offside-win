name: pg

# Run any engine command against Supabase by hand.
#
# This began as the parallel pipeline that proved Postgres while D1 kept serving
# the site. That job is done — every scheduled workflow now writes to Supabase
# and the Worker reads from it — but the ability to run one command, at a chosen
# scope, without waiting for a cron is worth keeping, and board:stats and
# eval:provider have no schedule of their own.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Engine command to run against Postgres'
        type: choice
        options: [migrate, history, ratings, slate, settle, backtest, board:stats, eval:provider]
        default: migrate
      leagues:
        # "all" rather than blank, because GitHub substitutes the default for an
        # empty input — so with a default set, blank can never mean everything.
        # Passing "" here silently ran 15 leagues while reporting success.
        description: 'Comma-separated league IDs, or "all" for every league the provider covers'
        type: string
        default: '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90'
      seasons:
        description: 'Seasons of history to backfill'
        type: string
        default: '3'
      stats_limit:
        description: 'Matches to pull per-match stats for in this run'
        type: string
        default: '4000'

concurrency:
  group: pg-engine-write
  cancel-in-progress: false

jobs:
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run ${{ inputs.command }} against Postgres
        env:
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          LEAGUES: ${{ inputs.leagues == 'all' && '' || inputs.leagues }}
          HISTORY_SEASONS: ${{ inputs.seasons }}
          STATS_LIMIT: ${{ inputs.stats_limit }}
        run: npm run ${{ inputs.command }}
