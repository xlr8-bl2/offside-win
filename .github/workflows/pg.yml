name: pg

# The Supabase pipeline, run separately from the live D1 workflows so the board
# keeps serving from D1 while Postgres is proved against it. Same engine, same
# commands — only DB_BACKEND differs. Once this reproduces the board and the
# backtest, the scheduled workflows switch over and this one goes away.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Engine command to run against Postgres'
        type: choice
        options: [migrate, history, ratings, slate, settle, backtest, board:stats]
        default: migrate
      leagues:
        # "all" rather than blank, because GitHub substitutes the default for an
        # empty input — so with a default set, blank can never mean everything.
        # Passing "" here silently ran 15 leagues while reporting success.
        description: 'Comma-separated league IDs, or "all" for every league the provider covers'
        type: string
        default: '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90'
      seasons:
        description: 'Seasons of history to backfill'
        type: string
        default: '3'
      stats_limit:
        description: 'Matches to pull per-match stats for in this run'
        type: string
        default: '4000'

concurrency:
  group: pg-engine-write
  cancel-in-progress: false

jobs:
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run ${{ inputs.command }} against Postgres
        env:
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          LEAGUES: ${{ inputs.leagues == 'all' && '' || inputs.leagues }}
          HISTORY_SEASONS: ${{ inputs.seasons }}
          STATS_LIMIT: ${{ inputs.stats_limit }}
        run: npm run ${{ inputs.command }}
