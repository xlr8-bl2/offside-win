name: pg

# Run any engine command against Supabase by hand.
#
# This began as the parallel pipeline that proved Postgres while D1 kept serving
# the site. That job is done — every scheduled workflow now writes to Supabase
# and the Worker reads from it — but the ability to run one command, at a chosen
# scope, without waiting for a cron is worth keeping, and board:stats and
# eval:provider have no schedule of their own.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Engine command to run against Postgres'
        type: choice
        options: [migrate, history, 'history:cards', ratings, slate, 'slate:fresh', settle, backtest, board:stats, eval:provider, h2h, market, 'probe:players', 'probe:profile', 'probe:reds', 'probe:extras', grant, plans, 'whop:check', 'gemini:check', trace, 'mail:setup', 'mail:route', 'db:export', 'db:verify', 'd1:create', 'db:import', 'db:accounts', 'mail:auth', 'record:reset', lab, 'lab:tune', 'lab:leans', 'lab:model', 'lab:losses', 'lab:slices', 'lab:live', 'lab:record', 'lab:calib', 'lab:odds', 'lab:backfill', 'leagues:refresh']
        default: migrate
      arg:
        # Free text for the commands that take one. `grant` reads an email and
        # an optional second word: "you@example.com", "you@example.com 30",
        # "you@example.com off".
        description: 'Argument for the command (grant: "email [days|off]"; plans: "id <checkout url | price in pence>"; trace: the code from #/trace; mail:setup: an email to send a test to; mail:route: the inbox support@ and hello@ forward to, or blank to check; mail:auth: on, off or blank; record:reset: dry, undo or blank)'
        type: string
        default: ''
      leagues:
        # "all" rather than blank, because GitHub substitutes the default for an
        # empty input — so with a default set, blank can never mean everything.
        # Passing "" here silently ran 15 leagues while reporting success.
        description: 'Comma-separated league IDs, or "all" for every league the provider covers'
        type: string
        default: '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90'
      seasons:
        description: 'Seasons of history to backfill'
        type: string
        default: '3'
      stats_limit:
        description: 'Matches to pull per-match stats for in this run'
        type: string
        default: '4000'
      export_run:
        # db:verify and db:import: which db:export run's encrypted artifact to load.
        description: 'db:verify / db:import / db:accounts: run id of the db:export run to load'
        type: string
        default: '37560985337'
      goal_dispersion:
        # Variance-to-mean ratio for a team's goals. 1.0 is Poisson. Exposed as
        # an input so a candidate value can be scored on the backtest's 34,210
        # matches before it is written into config as a default.
        description: 'Goal dispersion (1.0 = Poisson)'
        type: string
        default: '1.0'

concurrency:
  group: pg-engine-write
  cancel-in-progress: false

jobs:
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # db:verify only: a throwaway Postgres to load the export into, so the
    # Postgres functions can be asked the same questions as D1. Nothing else
    # touches it; it costs every run a few seconds to start.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # db:verify and db:import load the encrypted export from a db:export run
      # (HANDOFF.md, "The move to D1"). Decrypted on the runner only, into
      # engine/export, and removed at the end of the job.
      - name: Fetch the export
        if: inputs.command == 'db:verify' || inputs.command == 'db:import' || inputs.command == 'db:accounts'
        uses: actions/download-artifact@v4
        with:
          name: offside-export
          run-id: ${{ inputs.export_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Decrypt the export
        if: inputs.command == 'db:verify' || inputs.command == 'db:import' || inputs.command == 'db:accounts'
        env:
          EXPORT_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXPORT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:EXPORT_KEY -in artifact/offside-export.tar.enc | tar -C engine -xf -
          rm -rf artifact
          echo "$(ls engine/export | wc -l) files"
      - name: Run ${{ inputs.command }} against Postgres
        env:
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          LEAGUES: ${{ inputs.leagues == 'all' && '' || inputs.leagues }}
          HISTORY_SEASONS: ${{ inputs.seasons }}
          STATS_LIMIT: ${{ inputs.stats_limit }}
          PRICE_GOAL_DISPERSION: ${{ inputs.goal_dispersion }}
          # The same optional keys the scheduled workflows pass. Without them a
          # slate run from here silently falls back to the template grammar and
          # writes no photography -- which is a different run from the one the
          # cron does, while reporting success, and that is the worst kind of
          # difference to have between two ways of doing the same thing.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPORTRADAR_GETTY_KEY: ${{ secrets.SPORTRADAR_GETTY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          VERIFY_PG_URL: postgres://postgres:verify@localhost:5432/postgres
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WHOP_COMPANY_ID: biz_u3qYuQLDjOpDZH
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Actions expressions have no split(), and using one stops the whole
          # workflow from being dispatched. The shell splits the argument.
          ARG: ${{ inputs.arg }}
          COMMAND: ${{ inputs.command }}
        run: |
          read -r GRANT_EMAIL GRANT_ARG _ <<< "$ARG"
          export GRANT_EMAIL GRANT_ARG
          npm run "$COMMAND"
      # db:export only: the rows include emails and payment records and this
      # repository's artifacts are public, so the folder is encrypted with a key
      # only Actions can read before it is uploaded, and removed from the runner.
      - name: Encrypt the export
        if: inputs.command == 'db:export'
        env:
          EXPORT_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          test -n "$EXPORT_KEY"
          tar -C engine -cf - export | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:EXPORT_KEY -out offside-export.tar.enc
          rm -rf engine/export
          ls -la offside-export.tar.enc
      - uses: actions/upload-artifact@v4
        if: inputs.command == 'db:export'
        with:
          name: offside-export
          path: offside-export.tar.enc
          retention-days: 90
          compression-level: 0
      - name: Remove the export from the runner
        if: always() && (inputs.command == 'db:verify' || inputs.command == 'db:import' || inputs.command == 'db:accounts')
        run: rm -rf engine/export artifact
