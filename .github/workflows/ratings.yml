name: ratings

# The heavy job. Backfills finished matches, pulls their stats, then refits
# Dixon-Coles ratings and the corner/card rate models per league.
# Runs on a public repo, so standard-runner minutes are free and uncapped.
on:
  schedule:
    # Twice daily rather than nightly: after a cold start the slate holds only a
    # shallow season, and this is what deepens it. Waiting a full day for the
    # model to reach its real accuracy is a poor first impression.
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Re-pull all history rather than only new matches'
        type: boolean
        default: false

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Backfill match history
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
          # Empty means every league the provider covers — 88 of them, cups,
          # second tiers, women's and youth competitions included. This was
          # pinned to fifteen while the engine wrote to D1, whose free-tier
          # daily row-write quota the wide set exhausted in 27 minutes. Postgres
          # has no such quota: the same backfill wrote 66,782 rows in 402
          # queries. Set the LEAGUES repository variable to narrow it again.
          LEAGUES: ${{ vars.LEAGUES }}
        run: npm run history
      - name: Fit ratings
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          DB_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run ratings
