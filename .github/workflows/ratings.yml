name: ratings

# The heavy job. Backfills finished matches, pulls their stats, then refits
# Dixon-Coles ratings and the corner/card rate models per league.
# Runs on a public repo, so standard-runner minutes are free and uncapped.
on:
  schedule:
    # Twice daily rather than nightly: after a cold start the slate holds only a
    # shallow season, and this is what deepens it. Waiting a full day for the
    # model to reach its real accuracy is a poor first impression.
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Re-pull all history rather than only new matches'
        type: boolean
        default: false

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Backfill match history
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
          # Without this the nightly refresh rediscovers every league the
          # provider covers — 88 of them, cups and youth competitions included —
          # and backfills the lot, which exhausts D1's daily row-write quota and
          # takes the board down with it. Set the LEAGUES repository variable to
          # change the tracked set; the fallback is the scope this is running.
          LEAGUES: ${{ vars.LEAGUES || '1,3,4,5,6,39,40,41,42,43,44,7,8,83,90' }}
        run: npm run history
      - name: Fit ratings
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run ratings
