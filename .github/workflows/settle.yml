name: settle

# Grades published picks against results and refreshes per-market calibration,
# which feeds straight back into how far selection trusts each market.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run settle
