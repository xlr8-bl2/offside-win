name: settle

# Grades published picks against results and refreshes per-market calibration,
# which feeds straight back into how far selection trusts each market.
#
# REGISTRATION: this repo was created with GitHub's importer, which copies workflow
# files into git without registering them with Actions. A workflow stays invisible to
# the API — not listable, not dispatchable, 404 on dispatch — until a push modifies
# its file on the default branch. That is what this block is doing here. See HANDOFF.md.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: engine-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          # D1 through the Worker's engine door (HANDOFF.md, "The move to D1").
          DB_BACKEND: d1
          ENGINE_DB_URL: https://offside.win/api/internal/db
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run settle
